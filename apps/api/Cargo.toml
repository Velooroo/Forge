[package]
name = "api"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.7", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
serde_json = "1"
sqlx = { version = "0.7", features = ["runtime-tokio", "time", "tls-rustls", "postgres", "macros", "uuid"] }
tower-http = { version = "0.5", features = ["cors", "trace"] }
dotenvy = "0.15"
anyhow = "1.0"
argon2 = "0.5.3"
serde = "1.0.228"
base64 = "0.22.1"
